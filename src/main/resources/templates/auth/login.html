<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Arial,
                    sans-serif;

            background:
                    linear-gradient(
                            135deg,
                            #eef2ff 0%,
                            #f5f3ff 45%,
                            #faf5ff 100%
                    );
        }


        /* =========================
           LOGIN CARD
           ========================= */

        .login-container {
            width: 100%;
            max-width: 430px;
        }


        .login-card {
            background: #ffffff;

            padding: 40px;

            border-radius: 22px;

            box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.8);
        }


        /* =========================
           HEADER
           ========================= */

        .login-header {
            text-align: center;

            margin-bottom: 32px;
        }


        .login-logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            font-size: 30px;

            color: white;

            background:
                    linear-gradient(
                            135deg,
                            #4f46e5,
                            #7c3aed
                    );

            box-shadow:
                    0 10px 25px
                    rgba(79, 70, 229, 0.25);
        }


        .login-header h1 {
            margin-bottom: 8px;

            color: #111827;

            font-size: 28px;
            font-weight: 700;
        }


        .login-header p {
            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================
           FORM
           ========================= */

        .form-group {
            margin-bottom: 22px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           INPUT
           ========================= */

        .input-wrapper {
            position: relative;

            display: flex;
            align-items: center;
        }


        .input-icon {
            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

            opacity: 0.65;

            pointer-events: none;

            z-index: 2;
        }


        .form-control {
            width: 100%;
            height: 52px;

            padding:
                    0 16px 0 46px;

            border: 1px solid #d1d5db;

            border-radius: 12px;

            outline: none;

            background: #f9fafb;

            color: #111827;

            font-size: 15px;

            transition:
                    border-color 0.25s ease,
                    box-shadow 0.25s ease,
                    background 0.25s ease;
        }


        .form-control::placeholder {
            color: #9ca3af;
        }


        .form-control:hover {
            border-color: #9ca3af;

            background: #ffffff;
        }


        .form-control:focus {
            border-color: #4f46e5;

            background: #ffffff;

            box-shadow:
                    0 0 0 4px
                    rgba(79, 70, 229, 0.12);
        }


        /* =========================
           LOGIN BUTTON
           ========================= */

        .btn-login {
            width: 100%;
            height: 52px;

            margin-top: 4px;

            border: none;

            border-radius: 12px;

            background:
                    linear-gradient(
                            135deg,
                            #4f46e5,
                            #7c3aed
                    );

            color: #ffffff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                    0 8px 20px
                    rgba(79, 70, 229, 0.25);

            transition:
                    transform 0.25s ease,
                    box-shadow 0.25s ease,
                    opacity 0.25s ease;
        }


        .btn-login:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 12px 25px
                    rgba(79, 70, 229, 0.35);
        }


        .btn-login:active {
            transform: translateY(0);

            box-shadow:
                    0 5px 12px
                    rgba(79, 70, 229, 0.25);
        }


        /* =========================
           ERROR MESSAGE
           ========================= */

        .login-error {
            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 10px;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #dc2626;

            font-size: 14px;

            text-align: center;
        }


        /* =========================
           SUCCESS MESSAGE
           ========================= */

        .login-success {
            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 10px;

            background: #f0fdf4;

            border: 1px solid #bbf7d0;

            color: #16a34a;

            font-size: 14px;

            text-align: center;
        }


        /* =========================
           FOOTER
           ========================= */

        .login-footer {
            margin-top: 25px;

            text-align: center;

            color: #9ca3af;

            font-size: 13px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 28px 22px;

                border-radius: 18px;
            }

            .login-header {
                margin-bottom: 26px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-logo {
                width: 58px;
                height: 58px;

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- =========================
             HEADER
             ========================= -->

        <div class="login-header">

            <div class="login-logo">
                🔐
            </div>

            <h1>
                Đăng nhập
            </h1>

            <p>
                Chào mừng bạn quay trở lại
            </p>

        </div>


        <!-- =========================
             ERROR
             ========================= -->

        <div
                class="login-error"
                th:if="${param.error}">

            Username/Email hoặc mật khẩu không chính xác.

        </div>


        <!-- =========================
             LOGOUT SUCCESS
             ========================= -->

        <div
                class="login-success"
                th:if="${param.logout}">

            Bạn đã đăng xuất thành công.

        </div>


        <!-- =========================
             LOGIN FORM
             ========================= -->

        <form
                method="post"
                th:action="@{/login}">


            <!-- USERNAME / EMAIL -->

            <div class="form-group">

                <label for="identifier">
                    Username hoặc Email
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                            type="text"
                            id="identifier"
                            name="identifier"
                            class="form-control"
                            placeholder="Nhập username hoặc email"
                            autocomplete="username"
                            required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Mật khẩu
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                            required
                    >

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                    type="submit"
                    class="btn-login">

                Đăng nhập

            </button>


        </form>


        <!-- =========================
             FOOTER
             ========================= -->

        <div class="login-footer">

            © 2026 IoTStar. All rights reserved.

        </div>


    </div>

</div>


</body>

</html>
