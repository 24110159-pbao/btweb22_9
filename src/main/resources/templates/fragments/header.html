<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header class="topbar"
        th:fragment="header">

    <div class="brand">
        <a th:href="@{/}">
            IOTSTAR SHOP
        </a>
    </div>

    <nav>

        <a th:href="@{/}">
            Trang chủ
        </a>

        <a
                sec:authorize="isAuthenticated()"
                th:href="@{/categories}">
            Categories
        </a>

        <a
                sec:authorize="isAuthenticated()"
                th:href="@{/products}">
            Products
        </a>

        <a
                sec:authorize="hasRole('ADMIN')"
                th:href="@{/dashboard}">
            Dashboard
        </a>

        <a
                sec:authorize="hasRole('ADMIN')"
                th:href="@{/users}">
            Users
        </a>

    </nav>

    <div
            class="account"
            sec:authorize="isAuthenticated()">

        <span>
            Xin chào,
        </span>

        <strong
                th:text="${#authentication.principal.fullName}">
            Admin
        </strong>

        <span>
            (<span
                th:text="${#authentication.principal.username}">
                admin@gmail.com
            </span>)
        </span>

        <form
                th:action="@{/logout}"
                method="post"
                style="display:inline">

            <button
                    type="submit"
                    class="link-button">

                Đăng xuất

            </button>

        </form>

    </div>

    <div
            class="account"
            sec:authorize="!isAuthenticated()">

        <a
                th:href="@{/login}"
                class="btn primary small">

            Đăng nhập

        </a>

    </div>

</header>

</body>
</html>
